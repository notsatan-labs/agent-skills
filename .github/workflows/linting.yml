name: Linter

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "draft/**"
      - "docs/**"
      - "dura/**"
  pull_request:
    types: [ opened, reopened ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.14" ]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: make install

    - name: Log Versions
      run: |
        venv_python="$HOME/.virtualenvs/agent-skills/bin/python"
        "$venv_python" --version
        "$venv_python" -m pre_commit --version
        "$venv_python" -m black --version
        "$venv_python" -m isort --version-number

    - name: Run Linter(s)
      run: make checkstyle
