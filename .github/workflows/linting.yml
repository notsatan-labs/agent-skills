name: Linter

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - "draft/**"
      - "docs/**"
      - "dura/**"
  pull_request:
    types: [ opened, reopened ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.14" ]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Setup uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        version: "0.13.7"
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install Dependencies
      run: make install

    - name: Log Versions
      run: make versions

    - name: Run Linter(s)
      run: make checkstyle
